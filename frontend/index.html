    <script>
      (() => {
        let scheduled = false;
        let loaded = false;
        const loadAnalytics = () => {
          if (loaded) return;
          loaded = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-MK0EESK0ER');
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-MK0EESK0ER';
          document.head.appendChild(script);
          window.removeEventListener('pointerdown', scheduleOnInteraction);
          window.removeEventListener('keydown', scheduleOnInteraction);
          window.removeEventListener('touchstart', scheduleOnInteraction);
        };
        const scheduleOnInteraction = () => loadAnalytics();
        const schedule = () => {
          if (scheduled || loaded) return;
          scheduled = true;
          if (window.requestIdleCallback) {
            window.requestIdleCallback(loadAnalytics, { timeout: 3000 });
          } else {
            window.setTimeout(loadAnalytics, 1000);
          }
        };
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        window.addEventListener('pointerdown', scheduleOnInteraction, { once: true, passive: true });
        window.addEventListener('keydown', scheduleOnInteraction, { once: true });
        window.addEventListener('touchstart', scheduleOnInteraction, { once: true, passive: true });
      })();
    </script>

    <script>
      if (window.location.pathname === "/") {
        const configuredApiBase = __ROOMSLIDER_API_BASE__;
        const apiBase = (configuredApiBase ||
          (window.location.hostname === "localhost"
            ? "http://localhost:5000/api"
            : "https://roomslider-api.onrender.com/api")).replace(/\/+$/, "");
        window.__roomSliderHomeRoomsPromise = fetch(
          `${apiBase}/rooms?grouped=true&hourly=false`
        )
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Home listings request failed with status ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            const rooms = data?.rooms || [];
            try {
              localStorage.setItem("roomslider:api-cache:home-rooms-grouped", JSON.stringify({
                data: rooms,
                cachedAt: Date.now(),
              }));
            } catch {
              // The current page can still use the response when storage is unavailable.
            }
            return rooms;
          })
          .catch((error) => ({ error }));
      }
    </script>
