<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f6f2">
  <title>RoomSlider Cafe Theme Preview</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17211b;background:#f2f6f2;font-synthesis:none;--theme-background:#f2f6f2;--theme-surface:#fff;--theme-text:#17211b;--theme-muted:#435047;--theme-accent:#245b32;--theme-accent-ink:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--theme-background);color:var(--theme-text)}
    main{width:min(100% - 24px,1000px);margin:auto;padding:22px 0 48px}
    h1{margin:0;font-size:clamp(1.8rem,7vw,2.7rem);line-height:1.1}
    .intro{max-width:680px;color:var(--theme-muted);line-height:1.55}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;padding:14px;border:1px solid #9aa69c;border-radius:16px;background:var(--theme-surface)}
    label{display:grid;gap:6px;font-size:.88rem;font-weight:750}
    input{min-width:0;min-height:42px;padding:8px 10px;border:1px solid #66756b;border-radius:9px;background:var(--theme-surface);color:var(--theme-text);font:inherit}
    .night-toggle{display:flex;grid-column:1/-1;align-items:center;gap:9px}
    .night-toggle input{width:20px;min-height:20px;accent-color:var(--theme-accent)}
    .picked{grid-column:1/-1;margin:0;padding:11px;border-left:4px solid var(--theme-accent);background:var(--theme-background);font-weight:800}
    section{margin:28px 0}
    h2{font-size:1.25rem}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:13px}
    .card{--theme-background:#f5f5f5;--theme-surface:#fff;--theme-text:#171717;--theme-muted:#444;--theme-accent:#345;--theme-accent-ink:#fff;background:var(--theme-background);color:var(--theme-text);border:1px solid var(--theme-accent);border-radius:15px;overflow:hidden}
    .card.is-selected{outline:3px solid var(--theme-accent);outline-offset:2px}
    .sample-head{position:relative;padding:14px 15px 12px;border-bottom:3px solid var(--theme-accent);background:var(--theme-surface)}
    .sample-head:after{content:var(--theme-motif);position:absolute;right:13px;top:12px;font-size:1.25rem}
    [data-theme-card="diwali"] .sample-head:after{animation:diwali-twinkle 3.6s ease-in-out infinite alternate}
    @keyframes diwali-twinkle{from{opacity:.82;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
    .sample-brand{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--theme-text)}
    .sample-head h3{max-width:calc(100% - 42px);margin:3px 0;font-size:1.1rem}
    .greeting,.quote{margin:5px 0 0;color:var(--theme-muted);font-size:.84rem;line-height:1.4}
    .sample-items{display:grid;gap:0;padding:3px 14px;background:var(--theme-surface)}
    .item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--theme-background);font-size:.86rem}
    .item:last-child{border:0}
    .item span{color:var(--theme-muted)}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--theme-background);font-size:.78rem}
    .open-link{padding:8px 10px;border-radius:8px;background:var(--theme-accent);color:var(--theme-accent-ink);font-weight:800;text-decoration:none}
    :focus-visible{outline:3px solid #14532d;outline-offset:3px}
    body.night{--theme-background:#171a1d;--theme-surface:#24292d;--theme-text:#f7f8f5;--theme-muted:#d0d5d8}
    body.night .card{--theme-background:#171a1d;--theme-surface:#24292d;--theme-text:#f7f8f5;--theme-muted:#d0d5d8}
    @media(max-width:480px){main{width:min(100% - 18px,1000px);padding-top:17px}.tools{gap:10px;padding:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body data-theme-preview="true">
  <main>
    <h1>RoomSlider Cafe themes</h1>
    <p class="intro">A preview gallery for the demo menu. Festival dates marked to fill are intentionally unset; event examples are ignored by automatic selection.</p>
    <div class="tools" aria-label="Preview controls">
      <label for="preview-date">Date (IST) <input id="preview-date" type="date"></label>
      <label for="preview-hour">Hour (IST) <input id="preview-hour" type="number" min="0" max="23" inputmode="numeric"></label>
      <label class="night-toggle"><input id="night-mode" type="checkbox"> Night mode (all cards)</label>
      <p class="picked" id="picked-theme" aria-live="polite">Loading calendar…</p>
    </div>
    <section aria-labelledby="festival-heading">
      <h2 id="festival-heading">Festivals &amp; national days</h2>
      <div class="cards" id="festival-cards"></div>
    </section>
    <section aria-labelledby="event-heading">
      <h2 id="event-heading">Event days (examples)</h2>
      <div class="cards" id="event-cards"></div>
    </section>
    <section aria-labelledby="month-heading">
      <h2 id="month-heading">Months</h2>
      <div class="cards" id="month-cards"></div>
    </section>
  </main>
  <script src="/c/shared/theme-engine.js"></script>
  <script>
    (() => {
      "use strict";
      const engine = window.RoomsliderThemeEngine;
      const festivalIds = new Set([
        "makar-sankranti", "maha-shivaratri", "holi", "ram-navami", "raksha-bandhan",
        "janmashtami", "ganesh-chaturthi", "navratri", "dussehra", "dhanteras",
        "diwali", "bhai-dooj", "chhath", "gita-jayanti", "republic-day",
        "independence-day", "gandhi-jayanti"
      ]);
      const dateInput = document.getElementById("preview-date");
      const hourInput = document.getElementById("preview-hour");
      const nightInput = document.getElementById("night-mode");
      const result = document.getElementById("picked-theme");
      const params = new URLSearchParams(location.search);
      const forcedThemeId = params.get("theme");
      const now = new Date();
      dateInput.value = params.get("date") && engine.validDate(params.get("date")) ? params.get("date") : engine.istDate(now);
      const requestedHour = params.get("hour");
      hourInput.value = requestedHour !== null && /^(?:[0-9]|1[0-9]|2[0-3])$/.test(requestedHour)
        ? requestedHour : String(engine.istHour(now));

      function cardMarkup(selected) {
        const c = selected.colors;
        const style = `--theme-background:${c.background};--theme-surface:${c.surface};--theme-text:${c.text};--theme-muted:${c.muted};--theme-accent:${c.accent};--theme-accent-ink:#fff;--theme-motif:${JSON.stringify(selected.motif)}`;
        return `<article class="card" data-theme-card="${selected.id}" style="${style}">
          <div class="sample-head"><div class="sample-brand">RoomSlider Cafe</div><h3>${selected.name}</h3>
            <p class="greeting">${selected.greeting}</p><p class="quote"></p></div>
          <div class="sample-items">
            <div class="item"><strong>Masala Chai</strong><span>₹20</span></div>
            <div class="item"><strong>Ginger Chai</strong><span>₹25</span></div>
            <div class="item"><strong>Filter Coffee</strong><span>₹35</span></div>
          </div>
          <div class="card-foot"><span>${selected.id}</span><a class="open-link" href="/cafe/demo/roomslider?theme=${encodeURIComponent(selected.id)}">Open on demo menu</a></div>
        </article>`;
      }

      function renderCards() {
        const festivals = engine.themes.filter((item) => festivalIds.has(item.id));
        const events = engine.themes.filter((item) => item.id.startsWith("event-"));
        const months = engine.themes.filter((item) => item.id.startsWith("month-"));
        document.getElementById("festival-cards").innerHTML = festivals.map(cardMarkup).join("");
        document.getElementById("event-cards").innerHTML = events.map(cardMarkup).join("");
        document.getElementById("month-cards").innerHTML = months.map(cardMarkup).join("");
      }

      let calendar = null;
      function updateSelection() {
        const date = engine.validDate(dateInput.value) ? dateInput.value : engine.istDate(new Date());
        const hour = Number(hourInput.value);
        const automatic = engine.choose(date, calendar);
        const selected = engine.themes.find((item) => item.id === forcedThemeId) || automatic;
        const selectedHour = Number.isInteger(hour) && hour >= 0 && hour <= 23 ? hour : engine.istHour(new Date());
        const isNight = selectedHour >= 19 || selectedHour < 6;
        nightInput.checked = isNight;
        document.body.classList.toggle("night", isNight);
        const nightText = isNight ? " · dark variant" : "";
        result.textContent = forcedThemeId && selected.id === forcedThemeId
          ? `Previewing: ${selected.name} · Automatic pick for ${date} at ${selectedHour}:00 IST: ${automatic.name}${nightText}`
          : `For ${date} at ${selectedHour}:00 IST: ${automatic.name}${nightText}`;
        document.querySelectorAll("[data-theme-card]").forEach((card) => {
          const theme = engine.themes.find((item) => item.id === card.dataset.themeCard);
          const quote = card.querySelector(".quote");
          card.classList.toggle("is-selected", card.dataset.themeCard === selected.id);
          if (theme && quote) quote.textContent = engine.quoteForDate(date);
        });
      }

      nightInput.addEventListener("change", () => document.body.classList.toggle("night", nightInput.checked));
      dateInput.addEventListener("input", updateSelection);
      hourInput.addEventListener("input", updateSelection);
      renderCards();
      engine.loadCalendar().then((loadedCalendar) => {
        calendar = loadedCalendar;
        updateSelection();
      });
    })();
  </script>
</body>
</html>
