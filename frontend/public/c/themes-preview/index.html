<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f6f2">
  <title>RoomSlider Cafe Theme Preview</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17211b;background:#f2f6f2;font-synthesis:none;--theme-background:#f2f6f2;--theme-surface:#fff;--theme-text:#17211b;--theme-muted:#435047;--theme-accent:#245b32;--theme-accent-ink:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;overflow-x:clip;background:var(--theme-background);color:var(--theme-text);font-size:16px}
    main{width:min(100% - 20px,1000px);margin:auto;padding:calc(14px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom))}
    h1{margin:0;font-size:clamp(1.8rem,7vw,2.7rem);line-height:1.1}
    .intro{max-width:680px;color:var(--theme-muted);line-height:1.5}
    .tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;padding:10px max(10px,env(safe-area-inset-left)) 10px max(10px,env(safe-area-inset-right));border:1px solid #9aa69c;border-radius:0 0 14px 14px;background:var(--theme-surface);box-shadow:0 4px 14px #16231a20}
    label{display:grid;min-width:0;gap:4px;font-size:16px;font-weight:700}
    input{width:100%;min-width:0;min-height:48px;padding:7px;border:1px solid #66756b;border-radius:9px;background:var(--theme-surface);color:var(--theme-text);font:inherit}
    .switches{display:flex;grid-column:1/-1;gap:8px}
    .switch{display:flex;min-height:48px;flex:1;align-items:center;gap:7px;padding:4px 8px;border:1px solid #66756b;border-radius:10px}
    .switch input{width:24px;height:24px;min-height:24px;accent-color:var(--theme-accent)}
    .picked{grid-column:1/-1;margin:0;padding:9px;border-left:4px solid var(--theme-accent);background:var(--theme-background);font-size:16px;font-weight:750}
    section{margin:28px 0}
    h2{font-size:1.25rem}
    .cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
    .card{--theme-background:#f5f5f5;--theme-surface:#fff;--theme-text:#171717;--theme-muted:#444;--theme-accent:#345;--theme-accent-ink:#fff;background:var(--theme-background);color:var(--theme-text);border:1px solid var(--theme-accent);border-radius:15px;overflow:hidden}
    .card.is-selected{outline:3px solid var(--theme-accent);outline-offset:2px}
    .sample-head{position:relative;isolation:isolate;min-height:120px;padding:38px 14px 10px;border-bottom:3px solid var(--theme-accent);background:var(--theme-surface)}
    .sample-copy{position:relative;z-index:1;max-width:calc(100% - 38px)}
    .sample-effect{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
    .sample-decoration{position:absolute;z-index:2;top:8px;left:10px;width:28px;height:26px;pointer-events:none}
    .sample-head:after{content:var(--theme-motif);position:absolute;right:10px;top:8px;font-size:1.2rem}
    [data-theme-effects~="flag-wave"] .sample-decoration{left:auto;right:9px;width:37px;height:24px;border-radius:2px;background:linear-gradient(to bottom,#e87525 0 33%,#fff 33% 66%,#25834c 66%);transform-origin:left center}
    [data-theme-effects~="flag-wave"] .sample-decoration:after{content:"";position:absolute;left:16px;top:8px;width:6px;height:6px;border:1.5px solid #183b83;border-radius:50%}
    [data-theme-effects~="diya"] .sample-decoration{top:11px;left:10px;width:26px;height:11px;border:2px solid var(--theme-accent);border-top:0;border-radius:0 0 14px 14px;background:#e9a62d}
    [data-theme-effects~="diya"] .sample-decoration:before{content:"";position:absolute;left:8px;top:-12px;width:8px;height:12px;border-radius:80% 0 80% 0;background:#ef8f25;transform:rotate(45deg)}
    [data-theme-effects~="garba"] .sample-decoration{left:10px;width:26px;height:26px;border:4px solid transparent;border-radius:50%;background:conic-gradient(#8c2850 0 40deg,#744019 40deg 80deg,#315f38 80deg 120deg,#823028 120deg 160deg,#71328b 160deg 200deg,#284f78 200deg 240deg,#8b4319 240deg 280deg,#31594c 280deg 320deg,#74374c 320deg) border-box}
    [data-theme-effects~="steam"] .sample-decoration{left:10px;top:10px;width:26px;height:15px;border:2px solid var(--theme-accent);border-top:0;border-radius:0 0 7px 7px}
    :root[data-animations="on"] [data-theme-effects~="flag-wave"] .sample-decoration{animation:flag-wave 3s ease-in-out infinite}
    :root[data-animations="on"] [data-theme-effects~="diya"] .sample-decoration:before{animation:flame 1.8s ease-in-out infinite alternate}
    :root[data-animations="on"] [data-theme-effects~="garba"] .sample-decoration{animation:garba-spin 18s linear infinite}
    @keyframes flag-wave{0%,100%{transform:perspective(80px) rotateY(-8deg)}50%{transform:perspective(80px) rotateY(8deg) skewY(-2deg)}}
    @keyframes flame{to{opacity:.75;transform:rotate(48deg) scale(.94)}}
    @keyframes garba-spin{to{transform:rotate(360deg)}}
    .sample-brand{font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--theme-text)}
    .sample-head h3{max-width:calc(100% - 42px);margin:3px 0;font-size:1.1rem}
    .greeting,.quote{margin:5px 0 0;color:var(--theme-muted);font-size:16px;line-height:1.3}
    .sample-items{display:grid;gap:0;padding:3px 14px;background:var(--theme-surface)}
    .item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--theme-background);font-size:16px}
    .item:last-child{border:0}
    .item span{color:var(--theme-muted)}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:var(--theme-background);font-size:16px;overflow-wrap:anywhere}
    .open-link{display:inline-flex;min-height:44px;max-width:66%;align-items:center;justify-content:center;padding:7px 9px;border-radius:8px;background:var(--theme-accent);color:var(--theme-accent-ink);font-size:16px;font-weight:800;text-align:center;text-decoration:none}
    :focus-visible{outline:3px solid #14532d;outline-offset:2px}
    body.night{--theme-background:#171a1d;--theme-surface:#24292d;--theme-text:#f7f8f5;--theme-muted:#d0d5d8}
    body.night .card{--theme-background:#171a1d;--theme-surface:#24292d;--theme-text:#f7f8f5;--theme-muted:#d0d5d8}
    @media(min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.tools{grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}.switches{grid-column:span 2}.picked{grid-column:span 2}}
    @media(max-width:380px){main{width:calc(100% - 16px)}.tools{gap:6px;padding:8px}.switch{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body data-theme-preview="true">

    <p class="intro">A preview gallery for the demo menu. Festival dates marked to fill are intentionally unset; event examples are ignored by automatic selection.</p>

      <label for="preview-date">Date (IST) <input id="preview-date" type="date"></label>
      <label for="preview-time">Time (IST) <input id="preview-time" type="time" step="3600"></label>
      <div class="switches">
        <label class="switch"><input id="night-mode" type="checkbox"> Night mode</label>
        <label class="switch"><input id="animations-mode" type="checkbox"> Animations</label>
      </div>
      <p class="picked" id="picked-theme" aria-live="polite">Loading calendar…</p>
    </div>
    <section aria-labelledby="festival-heading">
      <h2 id="festival-heading">Festivals &amp; national days</h2>
      <div class="cards" id="festival-cards"></div>
    </section>
    <section aria-labelledby="event-heading">
      <h2 id="event-heading">Event days (examples)</h2>
      <div class="cards" id="event-cards"></div>
    </section>
    <section aria-labelledby="month-heading">
      <h2 id="month-heading">Months</h2>
      <div class="cards" id="month-cards"></div>
    </section>
  </main>
